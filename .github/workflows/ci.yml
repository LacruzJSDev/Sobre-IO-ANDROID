# Every pull request and every push to main must build, pass the unit tests and pass lint.
# The job name "build" is the required status check that protects main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same pull request cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same JDK as gradle/gradle-daemon-jvm.properties
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # No local.properties in CI: BuildConfig falls back to the emulator URL and an empty key,
      # which is enough to build and run unit tests (they never reach Supabase)
      - name: Build, unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
